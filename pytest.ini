[pytest]
pythonpath = . .ai_infra/mcp_servers
addopts = -ra
testpaths = tests
markers =
    module_access_control: Tests targeting src/access_control.
    module_agents: Tests targeting src/agents.
    module_audit: Tests targeting src/audit.
    module_compliance: Tests targeting src/compliance.
    module_config: Tests targeting src/config.
    module_core: Tests targeting src/core.
    module_identity: Tests targeting src/identity.
    module_integration: Tests targeting src/integration.
    module_mcp: Tests targeting src/mcp.
    module_observability: Tests targeting src/observability.
    module_persistence: Tests targeting src/persistence.
    module_policies: Tests targeting src/policies.
    module_resilience: Tests targeting src/resilience.
    module_runtime: Tests targeting src/runtime.
    module_schemas: Tests targeting src/schemas.
    module_secrets: Tests targeting src/secrets.
    module_tenancy: Tests targeting src/tenancy.
    module_tools: Tests targeting src/tools.
    module_unknown: Tests not directly mapped to one src module.
    soak: Non-blocking long-run soak scenarios (opt-in: pytest -m soak with EXO_RUN_SOAK_TESTS=true).
    live: Optional live-network adapter tests (opt-in: pytest -m live with EXO_RUN_LIVE_OPENAI=1 and OPENAI_API_KEY).
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
