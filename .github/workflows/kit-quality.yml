name: Kit Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/pip install -q jsonschema

      - name: make gates
        run: make gates

      - name: governance consistency
        run: .venv/bin/python .ai_infra/scripts/architecture/check_governance_consistency.py

      - name: make install-dry-run
        run: make install-dry-run

      - name: make check-plugin
        run: make check-plugin

      - name: check_debrand
        run: .venv/bin/python .ai_infra/scripts/architecture/check_debrand.py
