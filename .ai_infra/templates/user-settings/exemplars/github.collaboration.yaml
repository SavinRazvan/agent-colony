# github.collaboration.yaml — complete once at install
# Path: .local/user_settings/github.collaboration.yaml (gitignored)
# Role: GitHub identity, Project SSOT, commit trailers, and PR pipelines for humans and agents.
#
# Three surfaces (do not conflate):
#   - Git commits     → commit_provenance (Author, GitHub-User, Assisted-by)
#   - GitHub PR       → pr_collaboration (Action-By, Agent/s, body template)
#   - Project SSOT    → project_ssot (backlog / status board — replaces local tracker markdown)
#
# Kit default: AI uses Assisted-by (not Co-authored-by: cursoragent@...).
# Opt-in legacy mode below if your org requires Git co-author trailers for tools.
# Project SSOT: set enabled: true and fill board ids; requires gh scopes read:project + project (+ repo).
# Onboarding: gh auth login|refresh -s read:project,project — if no browser, https://github.com/login/device (see permissions-and-prerequisites.md § GitHub CLI).

version: 1

# ── Human owner (required) ───────────────────────────────────────────────────
owner:
  display_name: "Your Full Name"          # → Author: / Action-By:
  github_user: "@yourhandle"              # → GitHub-User: (include @)

# ── Project SSOT (GitHub Project board) ──────────────────────────────────────
# Agents: when enabled, read this before local plan.md / work-tracker.md.
# Your board must be kit-shaped (Status backlog|ready|in_progress|in_review|done;
# Priority p0–p2; Size xs–xl; Estimate number; Start date). Custom layouts are not auto-supported.
# Discover ids: gh project view <N> --owner <login> · gh project field-list <N> --owner <login>
# First-run shell: project doctor → /board (board-shell) → board-bootstrap --check
# Optional: board-bootstrap --check --ensure-fields (prints suggested field ids; human confirms before paste)
project_ssot:
  enabled: false                          # set true after filling board identity + field ids

  # Board identity
  name: "My Project Board"                # human label
  owner: your-github-login                # user or org login (no @)
  number: 1                               # projects/<number>
  url: https://github.com/users/your-github-login/projects/1
  project_id: PVT_kwPLACEHOLDER           # from gh project view --format json

  # Default code repo for Issue-at-create (item_kind_default: issue) and Linked PRs
  default_repo: your-org/your-repo

  # How agents call the Projects API
  tool: gh                                # gh (Pattern A) | mcp (optional later)

  # Truth policy
  #   board_only         — board wins; do not dual-write trackers
  #   board_first        — board primary; optional export to local
  #   offline_fallback   — use fallback when board unreachable
  sync_policy: board_only
  fallback: local_trackers                # local_trackers | none

  # Rate-limit outbox (local buffer — never a second Status SSOT)
  outbox:
    enabled: true
    path: .local/generated-data/board-outbox.jsonl
    min_graphql_remaining: 200          # refuse flush / precheck-queue when GraphQL remaining below this
    max_flush_per_run: 10
    retry_backoff_seconds: 30
    precheck_writes: true               # cached REST rate_limit before Pattern A writes
    quota_cache_ttl_seconds: 45         # avoid REST spam; protects GraphQL
    quota_cache_path: .local/generated-data/graphql-quota-cache.json
    dedupe_pending: true                # same op+item+payload → one pending outbox row

  # GraphQL-efficient Entry / export (human-like scoped reads — not a second SSOT)
  efficiency:
    entry_list_limit: 50                # project entry live list cap
    export_reuse_ttl_seconds: 900       # reuse snapshot if younger than this
    conserve_below_remaining: 1500      # prefer snapshot over live item-list
    offline_artifacts_below_remaining: 200  # skip Projects GraphQL reads (align min_flush)
    snapshot_path: .local/generated-data/project-board-snapshot.json

  # Project V2 single-select fields (replace ids from field-list)
  fields:
    status:
      field_id: PVTSSF_PLACEHOLDER_STATUS
      options:
        backlog: "STATUS_BACKLOG_OPTION_ID"
        ready: "STATUS_READY_OPTION_ID"
        in_progress: "STATUS_IN_PROGRESS_OPTION_ID"
        in_review: "STATUS_IN_REVIEW_OPTION_ID"
        done: "STATUS_DONE_OPTION_ID"
    priority:
      field_id: PVTSSF_PLACEHOLDER_PRIORITY
      options:
        p0: "PRIORITY_P0_OPTION_ID"
        p1: "PRIORITY_P1_OPTION_ID"
        p2: "PRIORITY_P2_OPTION_ID"
    size:
      # Size↔Estimate table (points): see board-ssot skill — xs=1, s=1–2, m=3–5, l=5–8, xl=split
      field_id: PVTSSF_PLACEHOLDER_SIZE
      options:
        xs: "SIZE_XS_OPTION_ID"
        s: "SIZE_S_OPTION_ID"
        m: "SIZE_M_OPTION_ID"
        l: "SIZE_L_OPTION_ID"
        xl: "SIZE_XL_OPTION_ID"
    # Tier-1 (replace ids from `gh project field-list`)
    start_date:
      # Set on claim / first in_progress when set_start_date_on_claim: true
      field_id: PVTF_PLACEHOLDER_START_DATE
    end_date:
      # Set on Status→Done when set_end_date_on_done: true (UTC today if empty)
      field_id: PVTF_PLACEHOLDER_END_DATE
    estimate:
      # Points (not hours) — align with Size band in skill
      field_id: PVTF_PLACEHOLDER_ESTIMATE

  # Multi-agent / multi-collaborator conventions
  conventions:
    queue_status: ready
    active_status: in_progress
    review_status: in_review
    done_status: done
    claim: set_assignee                   # set_assignee | title_prefix | none
    set_start_date_on_claim: true         # also first set-status/handoff → in_progress if empty
    set_end_date_on_done: true            # set-status/handoff/merge/heal → done if empty
    one_in_progress_per_assignee: true
    item_kind_default: issue              # issue (default — Assignees + Linked PRs) | draft (scratch only)
    promote_to_issue_on_pr: true
    close_linked_issue_on_cleanup: false  # opt-in: full-pr-workflow finalize.py closes linked Issue post-cleanup
    # Board Notes: @github_user/agent (owner.github_user from this file — not project_ssot.owner)
    attribution_format: "{github_user}/{agent}"
    require_attribution_on_exit: true
    body_sections:
      - Acceptance
      - Rollback
      - Notes

  # Stay local even when project_ssot.enabled
  local_only:
    - pr_phase_artifacts
    - audit_alignment_drift
    - coverage_exports
    - secrets
    - user_settings

# ── Git commit provenance ────────────────────────────────────────────────────
commit_provenance:
  # assisted_by (recommended) | co_author_trailer (legacy) | none
  ai_disclosure_mode: assisted_by

  # Repeat one line per AI/agent that materially shaped the change
  assisted_by:
    - tool: Cursor
      model: null                         # e.g. composer-2.5 — optional
      agent: null                         # e.g. implementer — optional
    # - tool: cursor-agent
    #   agent: test-runner

  # Real human co-authors only (Git Co-authored-by: convention)
  # Keep [] unless adding entries UNDER human_coauthors (do not uncomment lines below as siblings of []).
  human_coauthors: []
  # - display_name: "Alice Example"
  #   email: alice@example.com

  # Legacy opt-in: use instead of assisted_by when ai_disclosure_mode: co_author_trailer
  # co_author_trailer:
  #   name: Cursor
  #   email: cursoragent@cursor.com

  forbid_in_commits:
    - "Made-with:"                      # kit policy — use Author + Assisted-by instead

# ── PR collaboration (GitHub + local phase artifacts) ────────────────────────
pr_collaboration:
  # Named pipelines — PR phase presets; implementation agents come from trackers by default
  # (--agents-from-session merges change-index.md + session-pointer.md with PR agents)
  pipelines:
    default:
      agents:
        - review-pr
        - prepare-pr
        - merge-pr
    architecture_impacting:
      agents:
        - auditor
        - integrator
        - review-pr
        - prepare-pr
        - merge-pr
      requires_alignment_artifacts: true
    infrastructure_integration:
      agents:
        - integrator
        - auditor
        - review-pr
        - prepare-pr
    multi_agent_feature:
      agents:
        - implementer
        - test-runner
        - verifier
        - integrator
        - review-pr
        - prepare-pr
      session_pointer: .local/index-and-planning/current/session-pointer.md

  # Optional: other humans on reviews (informational for PR body)
  collaborators:
    humans: []
    # - display_name: "Alice Example"
    #   github_user: "@alice"
    #   roles: [reviewer]

  # gh pr create body — replace {{placeholders}} or copy sections manually
  pr_body:
    title_prefix: "feat"                  # convetional prefix hint only
    summary_heading: "## Summary"
    test_plan_heading: "## Test plan"
    collaboration_heading: "## Collaboration"
    default_test_plan:
      - "pytest -q"
      - "make gates (or project equivalent)"
    # Example filled body (for agents / gh):
    example: |
      ## Summary
      - Shared local-shell.css + site-nav.js for local HTML dashboards
      - Landing index.html; docs + folder charter updates

      ## Test plan
      - [ ] pytest -q
      - [ ] make gates

      ## Collaboration
      - Action-By: Your Full Name
      - GitHub-User: @yourhandle
      - Agent/s: review-pr | prepare-pr | merge-pr

# ── Rendered commit trailer (copy/paste or script-rendered) ──────────────────
# Replace placeholders after editing owner + assisted_by above.
#
# docs(scope): short subject line
#
# Optional body paragraph explaining why.
#
# Author: Your Full Name
# GitHub-User: @yourhandle
# Assisted-by: Cursor
