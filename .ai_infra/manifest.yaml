version: 1
kit_version: "0.7.2"
profiles:
  default:
    copy_dirs:
      - { src: .cursor, dst: .cursor }
      - { src: .agents, dst: .agents }
      - { src: agent_colony, dst: agent_colony }
    copy_ai_infra:
      - scripts/pr
      - scripts/architecture
      - scripts/integration
      - scripts/workflow
      - scripts/install
      - install/agent_colony
      - docs/operations
      - docs/governance
      - docs/roadmap
      - docs/decisions
      - docs/architecture
      - templates/local-workspace
      - templates/user-settings
      - templates/agent-integration
      - templates/project-board
      - templates/research-corpus
      - templates/ci
      - workflows
    copy_files:
      - bootstrap.py
      - paths.py
      - project.config.yaml.example
      - manifest.yaml
      - install-contract.json
      - schemas/mcp-registry.schema.json
      - schemas/github-collaboration.schema.json
      - schemas/mcp-agents.schema.json
    scaffold_local: true
    agents_md: stub
  with_mcp:
    extends: default
    copy_ai_infra:
      - mcp_servers/agent_colony_mcp
    copy_files:
      - requirements-mcp.txt
      - requirements-dev.txt
    mcp_json: true
  consumer_lite:
    extends: with_mcp
    agents_md: stub_lite
    skill_allowlist:
      - board-ssot
      - implementer-loop
      - evidence-first
      - test-coverage
      - workflow-activate
      - mcp-connect
    agent_allowlist:
      - board
      - implementer
      - test-runner
      - verifier
      - drift-guard
      - integrator
    rule_always_apply:
      - project-ssot-precedence.mdc
      - implementation-workflow-governance.mdc
      - pr-workflow-enforcement.mdc
      - local-artifact-protection.mdc
    rule_requestable:
      - advisory-audit-alignment-enforcement.mdc
      - commit-trailer-format.mdc
      - file-docstring-header-relations.mdc
    agents_skill_allowlist:
      - review-pr
      - prepare-pr
      - merge-pr
      - pr-workflow
      - full-pr-workflow
