# Board shell desired-state schema (Playground = kit default minimum)
#
# File: board-shell.schema.yaml
# Path: .ai_infra/templates/project-board/board-shell.schema.yaml
# Role: Machine-readable starter format for board-bootstrap --check and first-run coach.
# Used By:
#  - project board-bootstrap --check
#  - .cursor/skills/board-shell/SKILL.md
# Depends On:
#  - views-setup.md / views-checklist.md (human prose must match)
# Notes:
#  - Overlay: .local/user_settings/board-shell.schema.yaml (optional; wins when present).
#  - Views are human UI only (ADR-008). Schema encodes desired names for check/coach — not API mutation.
#  - Default minimum = full Playground view set (not “2 views + recommended later”).
#  - Agents write Tier-1 fields via CLI (incl. Start date on In progress, End date on Done);
#    Iteration / Labels / Reviewers stay human/cosmetic.

version: 1
name: playground-parity-starter

fields:
  required:
    - name: Status
      data_type: single_select
      # Option names must exist on the Project; ids live in github.collaboration.yaml
      options:
        - Backlog
        - Ready
        - In progress
        - In review
        - Done
    - name: Priority
      data_type: single_select
      options:
        - p0
        - p1
        - p2
    - name: Size
      data_type: single_select
      options:
        - xs
        - s
        - m
        - l
        - xl
    - name: Estimate
      data_type: number
    - name: Start date
      data_type: date
    - name: End date
      data_type: date

views:
  # Tier-1 visible columns agents need on board/table shells (Prioritized backlog + Status board).
  # Title / Assignees / Status / Linked pull requests are assumed; these are checked.
  visible_columns:
    - Title
    - Assignees
    - Status
    - Priority
    - Size
    - Estimate
    - Start date
    - End date
    - Linked pull requests

  # Kit default = full Playground set (FAIL if any missing).
  # Tier-1 column checks (Priority/Size/Estimate/Start date/End date) only on views with check_columns: true.
  minimum:
    - name: Status board
      layout: BOARD_LAYOUT
      group_by: Status
      check_columns: true
    - name: Prioritized backlog
      layout: TABLE_LAYOUT
      check_columns: true
    - name: Roadmap
      layout: ROADMAP_LAYOUT
      purpose: Timeline / Status overview
    - name: Bugs
      layout: TABLE_LAYOUT
      filter_hint: "title contains [BUG] / bug template"
    - name: In review
      layout: TABLE_LAYOUT
      filter_hint: "Status = In review"
    - name: My items
      layout: TABLE_LAYOUT
      filter_hint: "Assignees = @me"

  # Empty by default — customize via overlay if you want extra views beyond Playground.
  recommended: []

readme:
  template: project-readme.md
  # board-bootstrap --check fails when Project README is empty/whitespace

card_create:
  pattern: create-from-template
  templates:
    - slice
    - bug
    - research
  notes: >
    Tier-1 timing in board-ssot skill. Agents never mutate views.
    First-run coach: board-shell skill via /board.

customization:
  overlay_path: .local/user_settings/board-shell.schema.yaml
  safe: |
    Add Insights/filters; keep or drop cosmetic columns (Iteration, Labels, Reviewers).
    Keep required field names (Status, Priority, Size, Estimate, Start date, End date).
    Overlay may move a view from minimum → recommended only if your team accepts FAIL→WARN.
  unsafe: |
    Removing Tier-1 fields or Priority from Prioritized backlog / Status board breaks agents.
    Do not rely on undocumented view APIs.
