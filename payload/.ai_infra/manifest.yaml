version: 1
kit_version: "0.6.5"
profiles:
  default:
    copy_dirs:
      - { src: .cursor, dst: .cursor }
      - { src: .agents, dst: .agents }
      - { src: agent_colony, dst: agent_colony }
    copy_ai_infra:
      - scripts/pr
      - scripts/architecture
      - scripts/integration
      - scripts/workflow
      - scripts/install
      - install/agent_colony
      - docs/operations
      - docs/governance
      - docs/roadmap
      - docs/decisions
      - docs/architecture
      - templates/local-workspace
      - templates/user-settings
      - templates/agent-integration
      - templates/project-board
      - templates/research-corpus
      - workflows
    copy_files:
      - bootstrap.py
      - paths.py
      - project.config.yaml.example
      - manifest.yaml
      - install-contract.json
      - schemas/mcp-registry.schema.json
      - schemas/github-collaboration.schema.json
      - schemas/mcp-agents.schema.json
    scaffold_local: true
    agents_md: stub
  with_mcp:
    extends: default
    copy_ai_infra:
      - mcp_servers/agent_colony_mcp
    copy_files:
      - requirements-mcp.txt
      - requirements-dev.txt
    mcp_json: true
